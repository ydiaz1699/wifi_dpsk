[env:central]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
build_flags =
    -I../
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21.5
lib_extra_dirs =
    ../lib

[env:central_ota]
extends = env:central
upload_protocol = espota
upload_port = 192.168.0.201
; Export WIFI_PIR_OTA_PASSWORD locally before uploading; never commit it.
upload_flags =
    --auth=${sysenv.WIFI_PIR_OTA_PASSWORD}
