# base.yaml — Plataforma común para nodos satélite ESPHome (ESP8266 D1 mini).
#
# Incluye: core esphome, wifi (IP estática opcional), ota, logger, y los
# globals de identidad/sesión que usa mqtt_failover.yaml.
#
# El YAML del nodo concreto (p. ej. ventana_cocina.yaml) debe:
#   - definir las substitutions node_name, device_id_dec, friendly_name,
#     central_ip (y las de alarm_codes.yaml);
#   - incluir este archivo + alarm_codes.yaml + mqtt_failover.yaml;
#   - declarar sus binary_sensor/sensor que llaman a los scripts send_mqtt /
#     send_http de mqtt_failover.yaml.
#
# Secretos (wifi_ssid, wifi_password, mqtt_broker, mqtt_user, mqtt_pass,
# ota_password, api_key) van en esphome_satellites/secrets.yaml, que está
# en .gitignore. Nunca se versionan.

esphome:
  name: ${node_name}
  friendly_name: ${friendly_name}
  on_boot:
    # Prioridad 250: temprano, antes de wifi/mqtt, para fijar la sesión.
    priority: 250
    then:
      - lambda: |-
          // boot_counter monótono persistido en flash (preferences).
          // Resuelve el mismo problema que IoTStorage en el firmware C++:
          // una sesión nueva tras cada reinicio, para que el central
          // distinga replays viejos por (src, boot, seq).
          id(boot_counter) += 1;
          if (id(boot_counter) == 0) id(boot_counter) = 1;  // nunca 0
          id(seq) = 0;
          id(node_state) = 1;  // TRY_MQTT

esp8266:
  board: d1_mini
  restore_from_flash: true  # necesario para que boot_counter persista

# IP estática opcional: descomentar y ajustar en el nodo si se requiere.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # manual_ip:
  #   static_ip: 192.168.0.66
  #   gateway: 192.168.0.1
  #   subnet: 255.255.255.0
  ap:
    ssid: "${node_name} Fallback"
    password: !secret ota_password

captive_portal:

logger:
  level: INFO
  baud_rate: 115200

ota:
  - platform: esphome
    password: !secret ota_password

# API nativa de HA (opcional pero recomendada; convive con MQTT).
# Si solo quieres MQTT, puedes borrar este bloque.
api:
  encryption:
    key: !secret api_key

# --- Globals de identidad y sesión ---
globals:
  # Estado de la máquina de failover:
  #   0=BOOT, 1=TRY_MQTT, 2=NORMAL, 3=GRACE, 4=EMERGENCY
  - id: node_state
    type: int
    restore_value: no
    initial_value: '0'

  # BOOT_ID equivalente al del firmware C++. Persistido en flash.
  - id: boot_counter
    type: uint32_t
    restore_value: yes
    initial_value: '0'

  # SEQ monótono dentro de la sesión actual. Se reinicia a 0 en cada boot.
  - id: seq
    type: uint32_t
    restore_value: no
    initial_value: '0'

  # Último (code,value) físico pendiente de enviar, fijado en on_state del
  # sensor antes de llamar a send_mqtt / send_http.
  - id: pending_code
    type: int
    restore_value: no
    initial_value: '0'
  - id: pending_value
    type: int
    restore_value: no
    initial_value: '0'

  # Espejo reactivo del estado del broker MQTT (lo mantiene mqtt_failover.yaml).
  - id: mqtt_connected
    type: bool
    restore_value: no
    initial_value: 'false'
