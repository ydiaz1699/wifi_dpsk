[env:emisor_unificado]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
build_flags =
    -I../
lib_extra_dirs =
    ../lib

[env:emisor_unificado_ota]
extends = env:emisor_unificado
upload_protocol = espota
upload_port = 192.168.0.200
; Export WIFI_PIR_OTA_PASSWORD locally before uploading; never commit it.
upload_flags =
    --auth=${sysenv.WIFI_PIR_OTA_PASSWORD}
